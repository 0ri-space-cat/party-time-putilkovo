name: Deploy website to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload site via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      # Probes do not use any deployment secrets and do not upload files.
      - name: Diagnose FTPS capability
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Checking explicit FTPS on port 21 (anonymous TLS negotiation only)"
          curl --verbose --ssl-reqd --ftp-pasv \
            --connect-timeout 8 --max-time 15 \
            --user "anonymous:anonymous@example.invalid" \
            --list-only "ftp://$FTP_SERVER/" > /dev/null || true
          echo "Checking implicit FTPS TLS handshake on port 990"
          timeout 8 openssl s_client -brief \
            -connect "$FTP_SERVER:990" -servername "$FTP_SERVER" \
            < /dev/null 2>&1 || true

      - name: Verify Timeweb FTPS connection
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [[ "$FTP_SERVER" != "vh460.timeweb.ru" ]]; then
            echo "::error::FTP_SERVER does not match the expected Timeweb host."
            exit 1
          fi
          if [[ "$FTP_USERNAME" != "cd831058_deploy" ]]; then
            echo "::error::FTP_USERNAME does not match the restricted deployment user."
            exit 1
          fi
          if [[ -z "$FTP_PASSWORD" ]]; then
            echo "::error::FTP_PASSWORD is empty or missing."
            exit 1
          fi
          curl --silent --show-error --fail --ssl-reqd --ftp-pasv \
            --connect-timeout 10 --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only "ftp://$FTP_SERVER/public_html/" > /dev/null

      - name: Deploy static files to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: /public_html/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.DS_Store
            **/*.md
            **/package.json
            **/package-lock.json
            **/yarn.lock
            **/pnpm-lock.yaml
            **/.env
            **/.env.*
            **/cgi-bin
            **/cgi-bin/**
            **/index.htm
